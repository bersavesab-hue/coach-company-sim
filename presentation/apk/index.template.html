<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1218">
<title>客运公司模拟器</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#edf2f6;background:#0b1117}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1117;color:#edf2f6}button,input,select{font:inherit}
body{padding-bottom:116px}body.map-active{padding-bottom:calc(58px + env(safe-area-inset-bottom));overflow:hidden}
header{position:sticky;top:0;z-index:30;background:rgba(10,16,22,.97);backdrop-filter:blur(14px);border-bottom:1px solid #25313a;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;box-shadow:0 6px 18px #0002}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brandline{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#f3f5f4,#dfe6e7);color:#101820;display:grid;place-items:center;font-weight:950;font-size:16px;box-shadow:0 4px 12px #0003}
.title{font-weight:900;font-size:17px;line-height:1.05;letter-spacing:.1px}.clock{font-size:10px;color:#93a5b2;text-align:right;line-height:1.45;white-space:nowrap}.headerCash{font-size:15px;color:#f7f9fa;font-weight:850;letter-spacing:.2px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(10,16,22,.975);border-top:1px solid #27343e;box-shadow:0 -8px 22px #0003}
nav button{border:0;background:transparent;color:#8395a2;padding:8px 3px 7px;border-radius:12px;font-size:11px;white-space:nowrap;font-weight:650}
nav button::before{content:"";display:block;width:20px;height:3px;border-radius:5px;margin:0 auto 5px;background:transparent}
nav button.active{color:#f5f7f8;background:#17242e}nav button.active::before{background:#e9b454}
main{max-width:1180px;margin:0 auto;padding:10px 10px 8px}.page{display:none}.page.active{display:block}
#map.page.active{margin:-10px -10px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric,.card,.panel{background:#121b23;border:1px solid #293640;border-radius:13px;padding:11px}
.metric b{display:block;font-size:19px;letter-spacing:-.3px}.metric span,.muted{font-size:11px;color:#8fa2b1}.section{font-size:14px;margin:15px 2px 8px;color:#dfe7ed}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.name{font-weight:750}.tag{display:inline-block;background:#1d2a34;color:#becbd4;padding:3px 7px;border-radius:7px;font-size:10px;margin:4px 4px 0 0}
.list{display:flex;flex-direction:column;gap:7px}.detail{font-size:12px;line-height:1.65;color:#c7d2da;margin-top:7px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.btn{border:0;border-radius:9px;padding:8px 10px;background:#e9eef1;color:#111820;font-weight:750;font-size:12px}.btn.secondary{background:#202d37;color:#dce5eb;border:1px solid #34444f}.btn.danger{background:#44282a;color:#ffdadd}
.toolbar{display:flex;gap:6px;flex-wrap:wrap}.toolbar .btn{flex:1;min-width:82px}input,select{width:100%;border:1px solid #34444f;border-radius:9px;background:#0e171e;color:#eef3f6;padding:9px;font-size:12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:7px}.form .wide{grid-column:1/-1}
.notice{position:fixed;left:10px;right:10px;bottom:118px;z-index:60;padding:10px 11px;border-radius:10px;background:#eef2f4;color:#101820;font-size:12px;display:none;box-shadow:0 10px 35px #0009}.notice.error{background:#5b292d;color:#fff}
footer{position:fixed;left:8px;right:8px;bottom:59px;z-index:39;background:rgba(17,25,33,.94);border:1px solid #2b3944;border-radius:12px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;box-shadow:0 6px 20px #0006}
footer button{border:0;border-radius:8px;padding:8px 4px;background:#1d2a34;color:#d9e2e8;font-size:11px}
body.map-active footer{display:none}
.mapShell{position:relative;background:#cad0c0;overflow:hidden;height:calc(100dvh - 128px);min-height:430px}
.mapwrap{width:100%;height:100%;min-height:0;position:relative;overflow:hidden;touch-action:none;background:
linear-gradient(160deg,#ececdf,#dfe4d8 54%,#e5e2d7)}
.mapwrap svg{width:100%;height:100%;display:block}
.mapHud{position:absolute;left:10px;top:10px;z-index:7;display:flex;gap:7px;align-items:center;max-width:calc(100% - 76px)}
.mapChip{min-width:164px;background:linear-gradient(145deg,rgba(12,21,27,.94),rgba(20,31,38,.91));border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:9px 11px;color:#f2f5f6;box-shadow:0 8px 22px #0004}.mapChip b{font-size:13px;display:block;font-weight:900;letter-spacing:.15px}.mapChip span{font-size:9.5px;color:#9fb0ba;display:block;margin-top:3px}
.mapControls{position:absolute;right:10px;top:10px;z-index:8;display:flex;flex-direction:column;gap:7px}.mapControls button{width:42px;height:42px;border:1px solid rgba(255,255,255,.18);border-radius:13px;background:rgba(12,21,27,.94);color:#fff;font-size:18px;font-weight:800;box-shadow:0 6px 18px #0003}
.mapControls button:active{transform:scale(.96)}
.mapLegend{position:absolute;left:10px;bottom:12px;z-index:7;background:rgba(12,21,27,.88);border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:7px 9px;display:flex;gap:9px;flex-wrap:wrap;font-size:9px;color:#cbd5db;max-width:calc(100% - 150px);box-shadow:0 5px 16px #0003}
.leg{display:flex;align-items:center;gap:4px}.leg i{display:block;width:20px;border-top-style:solid;border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,.10)}.leg.exp i{border-top-width:6px;border-color:#0a8e74}.leg.nat i{border-top-width:5px;border-color:#c66b56}.leg.pro i{border-top-width:4px;border-color:#9a9c73}.leg.cty i{border-top-width:3px;border-color:#9ca9a2}.leg.route i{border-top-width:4px;border-color:#f2a23b}
.road-shadow,.road-casing,.road,.road-detail{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.road-shadow{stroke:#405148;opacity:.09}
.road{stroke:#f8f4e9}
.road-detail{display:none;pointer-events:none}
.road-shadow.local{stroke-width:3.0;opacity:.06}.road-casing.local{stroke:#b8c0bb;stroke-width:2.15}.road.local{stroke-width:1.08}
.road-shadow.county_road{stroke-width:3.8;opacity:.07}.road-casing.county_road{stroke:#9ca9a2;stroke-width:2.75}.road.county_road{stroke-width:1.46}
.road-shadow.provincial_road{stroke-width:4.9;opacity:.08}.road-casing.provincial_road{stroke:#9a9c73;stroke-width:3.65}.road.provincial_road{stroke-width:2.08}
.road-shadow.national_road{stroke-width:6.2;opacity:.09}.road-casing.national_road{stroke:#c66b56;stroke-width:4.75}.road.national_road{stroke-width:2.78}
.road-shadow.expressway{stroke-width:7.9;opacity:.10}.road-casing.expressway{stroke:#0a8e74;stroke-width:6.05}.road.expressway{stroke-width:3.55}
.road-detail.expressway{stroke:#b7d9cc;stroke-width:.72}.road-detail.national_road{stroke:#ead5c9;stroke-width:.55}
.road-shadow.role-urban_ring{stroke-width:5.2;opacity:.08}.road-casing.role-urban_ring{stroke:#689c86;stroke-width:3.85}.road.role-urban_ring{stroke-width:2.18}
.road-shadow.role-connector{stroke-width:4.2;opacity:.07}.road-casing.role-connector{stroke:#8eaa9a;stroke-width:3.05}.road.role-connector{stroke-width:1.68}
.road-shadow.role-ramp{stroke-width:3.1;opacity:.06}.road-casing.role-ramp{stroke:#95afa2;stroke-width:2.25}.road.role-ramp{stroke-width:1.12}
.road-shadow.role-local_access{stroke-width:2.8;opacity:.05}.road-casing.role-local_access{stroke:#adb8b2;stroke-width:2.0}.road.role-local_access{stroke-width:.96}
.junctionCasing,.junctionPatch{vector-effect:non-scaling-stroke}.junctionCasing{stroke:none}.junctionPatch{fill:#f8f4e9;stroke:none}
.junctionCasing.expressway{fill:#0a8e74}.junctionCasing.national_road{fill:#c66b56}.junctionCasing.provincial_road{fill:#9a9c73}.junctionCasing.county_road{fill:#9ca9a2}.junctionCasing.local{fill:#b8c0bb}
.junctionHalo{fill:none;stroke:#6f8078;stroke-width:.6;opacity:.16;vector-effect:non-scaling-stroke}
.roadShield{filter:drop-shadow(0 1px 1px rgba(24,42,34,.18))}
.roadShield rect{rx:3;ry:3;stroke:#fffdf7;stroke-width:.8;vector-effect:non-scaling-stroke}.roadShield text{font-size:7.1px;font-weight:850;text-anchor:middle;fill:#fff;pointer-events:none}.roadShield.expressway rect{fill:#087b68}.roadShield.national_road rect{fill:#c85f4c}.roadShield.provincial_road rect{fill:#8a8b62}.roadShield.county_road rect{fill:#72857c}.roadShield.local rect{fill:#858d88}
.stationHalo{fill:none;stroke:#d89c3d;stroke-width:2.2;opacity:.46;vector-effect:non-scaling-stroke}
.station{fill:#f7f4e8;stroke:#202b32;stroke-width:1.8;vector-effect:non-scaling-stroke}.station.hub{fill:#f0b75c;stroke-width:2.5}.station.city{fill:#fbf6e9;stroke-width:2.1}.station.county{fill:#eef0e9;stroke-width:1.6}.station.town{fill:#e7ebe4;stroke-width:1.3}
.station.locked{fill:#c4cac5;stroke:#7e8882;opacity:.58}.stationHalo.locked{stroke:#929b96;opacity:.22}
.stationLabel{font-size:10px;fill:#1c272c;paint-order:stroke;stroke:#f1f2e9;stroke-width:3.2px;stroke-linejoin:round;font-weight:650;pointer-events:none}.stationLabel.hub{font-size:15px;font-weight:900}.stationLabel.city{font-size:12.5px;font-weight:780}.stationLabel.county{font-size:10.5px}.stationLabel.town{font-size:9px}.stationLabel.locked{fill:#747d78;stroke:#e7e9e1;opacity:.62}
.stationLeader{stroke:#6f7b75;stroke-width:.65;opacity:.32;vector-effect:non-scaling-stroke;pointer-events:none}
.stationLock rect{fill:#69746e;stroke:#eef1e9;stroke-width:.7;vector-effect:non-scaling-stroke}.stationLock path{fill:none;stroke:#69746e;stroke-width:1.2;stroke-linecap:round;vector-effect:non-scaling-stroke}
.routeHalo{fill:none;stroke-width:8.2;opacity:.16;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.routeLine{fill:none;stroke-width:4.25;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.routeTone0.routeHalo{stroke:#d97816}.routeTone0.routeLine{stroke:#f2a23b}.routeTone1.routeHalo{stroke:#c88414}.routeTone1.routeLine{stroke:#eeb847}.routeTone2.routeHalo{stroke:#c85f35}.routeTone2.routeLine{stroke:#eb8651}.routeTone3.routeHalo{stroke:#b9791d}.routeTone3.routeLine{stroke:#e1a23c}
.routeBadge{filter:drop-shadow(0 2px 2px rgba(32,25,14,.18))}.routeBadge rect{stroke:#fff8ea;stroke-width:1;rx:5;ry:5}.routeBadge.routeTone0 rect{fill:#e58c24}.routeBadge.routeTone1 rect{fill:#d99f2e}.routeBadge.routeTone2 rect{fill:#d66f43}.routeBadge.routeTone3 rect{fill:#c88a2b}.routeBadge text{fill:#fff;font-size:8.7px;font-weight:900;text-anchor:middle}
.routeStop{fill:#fff8e9;stroke-width:2.4;vector-effect:non-scaling-stroke}.routeStop.routeTone0{stroke:#e58c24}.routeStop.routeTone1{stroke:#d99f2e}.routeStop.routeTone2{stroke:#d66f43}.routeStop.routeTone3{stroke:#c88a2b}
.vehicle{fill:#f0b44e;stroke:#151d22;stroke-width:2.2;vector-effect:non-scaling-stroke}
.roadCode{font-size:8.5px;font-weight:900;text-anchor:middle;paint-order:stroke;stroke:#f4f1e5;stroke-width:3px;stroke-linejoin:round;pointer-events:none}.roadCode.expressway{fill:#087f6e}.roadCode.national_road{fill:#168a73}.roadCode.provincial_road{fill:#3d8c72}.roadCode.county_road{fill:#657b70}.roadCode.local{fill:#7b817a}
.baseTerrainFallback{opacity:.84;pointer-events:none}.baseTerrainTile{opacity:.86;pointer-events:none}.terrainWash{fill:#f1efdf;opacity:.10;pointer-events:none}
#mapSvg[data-detail="0"] .priority2,#mapSvg[data-detail="0"] .priority3,#mapSvg[data-detail="0"] .priority4{display:none}
#mapSvg[data-detail="1"] .priority3,#mapSvg[data-detail="1"] .priority4{display:none}
#mapSvg[data-detail="2"] .priority4{display:none}
#mapSvg[data-detail="0"] .road-shadow.expressway{stroke-width:5.5;opacity:.055}#mapSvg[data-detail="0"] .road-casing.expressway{stroke-width:4.25}#mapSvg[data-detail="0"] .road.expressway{stroke-width:2.25}
#mapSvg[data-detail="0"] .roadShield{display:none}
#mapSvg[data-detail="1"] .road-shadow.expressway{stroke-width:6.5;opacity:.07}#mapSvg[data-detail="1"] .road-casing.expressway{stroke-width:4.9}#mapSvg[data-detail="1"] .road.expressway{stroke-width:2.8}
#mapSvg[data-detail="1"] .road-shadow.national_road{stroke-width:4.7;opacity:.065}#mapSvg[data-detail="1"] .road-casing.national_road{stroke-width:3.55}#mapSvg[data-detail="1"] .road.national_road{stroke-width:1.95}
#mapSvg[data-detail="2"] .road-shadow.expressway{stroke-width:7.2}#mapSvg[data-detail="2"] .road-casing.expressway{stroke-width:5.45}#mapSvg[data-detail="2"] .road.expressway{stroke-width:3.2}
#mapSvg[data-detail="3"] .road-detail.expressway,#mapSvg[data-detail="3"] .road-detail.national_road{display:block}
#mapSvg[data-detail="3"] .road-shadow.expressway{stroke-width:8.2}#mapSvg[data-detail="3"] .road-casing.expressway{stroke-width:6.25}#mapSvg[data-detail="3"] .road.expressway{stroke-width:3.72}
#mapSvg[data-detail="0"] .junctionCasing.priority2,#mapSvg[data-detail="0"] .junctionCasing.priority3,#mapSvg[data-detail="0"] .junctionCasing.priority4,#mapSvg[data-detail="0"] .junctionPatch.priority2,#mapSvg[data-detail="0"] .junctionPatch.priority3,#mapSvg[data-detail="0"] .junctionPatch.priority4,#mapSvg[data-detail="0"] .junctionHalo.priority2,#mapSvg[data-detail="0"] .junctionHalo.priority3,#mapSvg[data-detail="0"] .junctionHalo.priority4{display:none}
#mapSvg[data-detail="1"] .junctionCasing.priority3,#mapSvg[data-detail="1"] .junctionCasing.priority4,#mapSvg[data-detail="1"] .junctionPatch.priority3,#mapSvg[data-detail="1"] .junctionPatch.priority4,#mapSvg[data-detail="1"] .junctionHalo.priority3,#mapSvg[data-detail="1"] .junctionHalo.priority4{display:none}
#mapSvg[data-detail="2"] .junctionCasing.priority4,#mapSvg[data-detail="2"] .junctionPatch.priority4,#mapSvg[data-detail="2"] .junctionHalo.priority4{display:none}
#mapSvg[data-detail="0"] .station.city,#mapSvg[data-detail="0"] .station.county,#mapSvg[data-detail="0"] .station.town,#mapSvg[data-detail="0"] .stationLabel.city,#mapSvg[data-detail="0"] .stationLabel.county,#mapSvg[data-detail="0"] .stationLabel.town{display:none}
#mapSvg[data-detail="1"] .station.county,#mapSvg[data-detail="1"] .station.town,#mapSvg[data-detail="1"] .stationLabel.county,#mapSvg[data-detail="1"] .stationLabel.town{display:none}
#mapSvg[data-detail="2"] .station.town,#mapSvg[data-detail="2"] .stationLabel.town{display:none}
.mapFoot{display:none}.mapRouteBtn{position:absolute;right:10px;bottom:12px;z-index:8;border:1px solid rgba(255,255,255,.4);border-radius:13px;padding:10px 13px;background:#f2f5f4;color:#111820;font-weight:900;font-size:12px;box-shadow:0 7px 20px #0004}
.mapTimeDock{position:absolute;left:50%;bottom:52px;z-index:8;transform:translateX(-50%);display:flex;gap:4px;padding:4px;background:rgba(12,21,27,.88);border:1px solid rgba(255,255,255,.10);border-radius:12px;box-shadow:0 5px 16px #0003}
.mapTimeDock button{border:0;border-radius:9px;padding:7px 9px;min-width:44px;background:#1a2a34;color:#dce5ea;font-size:9.5px;font-weight:750}.mapTimeDock button.primary{background:#e8b257;color:#172028}
.empty{padding:22px;text-align:center;color:#8295a5}.money.pos{color:#8cd9a4}.money.neg{color:#ff9999}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.form{grid-template-columns:repeat(4,1fr)}main{padding-left:14px;padding-right:14px}#map.page.active{margin-left:-14px;margin-right:-14px}}
</style>
</head>
<body>
<header><div class="top"><div class="brandline"><div class="logo">客</div><div><div class="title">星河客运</div><div class="muted" id="companyName">加载中</div></div></div><div><div class="headerCash" id="headerCash">¥0</div><div class="clock" id="clock"></div></div></div></header>
<nav id="nav">
<button class="active" data-page="map">地图</button>
<button data-page="routes">线路</button>
<button data-page="fleet">车队</button>
<button data-page="market">车市</button>
<button data-page="home">经营</button>
</nav>
<main>
<section class="page" id="home"><div class="grid" id="homeMetrics"></div><h2 class="section">快捷经营</h2><div class="toolbar"><button class="btn" onclick="advance(60)">推进1小时</button><button class="btn" onclick="advance(360)">推进6小时</button><button class="btn secondary" onclick="commitToday()">提交今日排班</button><button class="btn secondary" onclick="replanToday()">重排今日运营</button></div><h2 class="section">运营状态</h2><div id="homeStatus"></div><h2 class="section">管理中心</h2><div class="toolbar"><button class="btn secondary" onclick="openPage('dispatch')">调度中心</button><button class="btn secondary" onclick="openPage('finance')">财务报表</button></div></section>
<section class="page active" id="map">
<div class="mapShell" id="mapShell">
  <div class="mapwrap" id="mapWrap">
    <svg id="mapSvg" viewBox="0 0 1100 825" data-detail="0"></svg>
    <div class="mapHud">
      <div class="mapChip"><b>全国运营路网</b><span id="mapStats">加载中</span></div>
    </div>
    <div class="mapControls">
      <button onclick="mapZoom(.72)">＋</button>
      <button onclick="mapZoom(1.38)">－</button>
      <button onclick="mapReset()">⌂</button>
    </div>
    <div class="mapLegend">
      <span class="leg exp"><i></i>高速</span>
      <span class="leg nat"><i></i>国道</span>
      <span class="leg pro"><i></i>省道</span>
      <span class="leg cty"><i></i>县乡道</span><span class="leg route"><i></i>运营线路</span>
    </div>
  </div>
  <div class="mapTimeDock">
    <button onclick="advance(15)">+15分</button>
    <button class="primary" onclick="advance(60)">+1小时</button>
    <button onclick="advance(360)">+6小时</button>
  </div>
  <button class="mapRouteBtn" onclick="openPage('routes')">＋ 新建线路</button>
</div>
</section>
<section class="page" id="routes"><div class="panel"><div class="name">新建线路</div><div class="form" style="margin-top:9px"><input id="routeCode" value="K01" placeholder="线路编号"><select id="origin"></select><select id="destination"></select><button class="btn" onclick="createRoute()">创建并开通</button></div></div><h2 class="section">已有线路</h2><div class="list" id="routeList"></div></section>
<section class="page" id="market"><div class="toolbar"><button class="btn secondary" onclick="setMarketFilter('all')">全部</button><button class="btn secondary" onclick="setMarketFilter('new')">新车</button><button class="btn secondary" onclick="setMarketFilter('used')">二手</button></div><h2 class="section">动态车源</h2><div class="list" id="marketList"></div></section>
<section class="page" id="dispatch"><div class="grid" id="dispatchMetrics"></div><h2 class="section">班次</h2><div class="list" id="tripList"></div><h2 class="section">缺口</h2><div class="list" id="shortageList"></div></section>
<section class="page" id="fleet"><div class="list" id="fleetList"></div></section>
<section class="page" id="finance"><div class="grid" id="financeMetrics"></div><h2 class="section">经营说明</h2><div class="card detail">票款、购车、能源、通行费、站务费、司机工资、维护、保险、车辆税和折旧均来自正式 Finance Ledger。时间推进后会自动结算。</div></section>
</main>
<div class="notice" id="notice"></div>
<footer><button onclick="advance(15)">+15分</button><button onclick="advance(60)">+1小时</button><button onclick="advance(360)">+6小时</button><button onclick="refresh()">刷新</button></footer>
<script src="game.js"></script>
<script>
let state=null,marketFilter="all",mapCamera=null,mapDrag=null,terrainTileKey="",terrainFallbackVisible=true,mapViewConfig=__MAP_VIEW_CONFIG_JSON__;
const q=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=c=>"¥"+(Number(c||0)/100).toLocaleString("zh-CN",{maximumFractionDigits:0});
const time=s=>{s=Number(s||0);const d=Math.floor(s/86400)+1,h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60);return "第"+d+"天 "+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")};
function fitMapShell(){const shell=q("mapShell"),header=document.querySelector("header"),nav=q("nav");if(!shell||!header||!nav)return;const height=window.innerHeight-header.getBoundingClientRect().height-nav.getBoundingClientRect().height;shell.style.height=Math.max(430,height)+"px"}

function renderFleet(){const vehicles=state.dispatch?.vehicles||[];const dealers=(Array.isArray(state.market)?state.market:[]).reduce((m,x)=>(m[x.dealerId]=x.dealerName,m),{});const dealerId=Object.keys(dealers)[0]||"";q("fleetList").innerHTML=vehicles.length?vehicles.map(v=>'<div class="card"><div class="row"><div><div class="name">'+esc(v.vehicleId)+'</div><div class="muted">'+esc(v.serviceClass)+' · '+esc(v.status)+'</div></div><b>'+Math.round(v.energyPermille/10)+'%</b></div><div><span class="tag">里程 '+Math.round(v.mileageM/1000)+'km</span><span class="tag">保养余量 '+v.kilometersUntilMaintenance+'km</span><span class="tag">动力 '+v.powertrainConditionPermille+'</span></div><div class="actions"><button class="btn" onclick="call(\'refuelFull\',\''+esc(v.vehicleId)+'\')">加满</button><button class="btn secondary" onclick="call(\'maintain\',\''+esc(v.vehicleId)+'\')">保养</button><button class="btn secondary" onclick="call(\'renewInsurance\',\''+esc(v.vehicleId)+'\')">续保</button><button class="btn secondary" onclick="call(\'passInspection\',\''+esc(v.vehicleId)+'\')">年检</button>'+(dealerId?'<button class="btn danger" onclick="call(\'sellToDealer\',\''+esc(v.vehicleId)+'\',\''+esc(dealerId)+'\')">卖给车商</button>':'')+'</div></div>').join(""):'<div class="empty">还没有车辆，先去车市购买。</div>'}
function renderFinance(){const f=state.finance||{};q("financeMetrics").innerHTML=metric("现金",money(f.cashBalanceCents))+metric("总资产",money(f.totalAssetsCents))+metric("客运收入",money(f.passengerRevenueCents))+metric("经营费用",money(f.totalExpenseCents))+metric("会计利润",money(f.accountingProfitCents))+metric("车辆净值",money(f.vehicleAssetNetCents))+metric("能源库存",money(f.energyInventoryCents))+metric("应付款",money(f.accountsPayableCents))}
const advance=m=>call("advanceMinutes",m),commitToday=()=>call("commitToday"),replanToday=()=>call("replanToday");
async function boot(){await refresh()}
boot();
</script>
