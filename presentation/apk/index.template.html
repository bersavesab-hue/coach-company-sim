<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1218">
<title>客运公司模拟器</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#edf2f6;background:#0b1117}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1117;color:#edf2f6}button,input,select{font:inherit}
body{padding-bottom:116px}
header{position:sticky;top:0;z-index:30;background:rgba(12,18,24,.96);backdrop-filter:blur(12px);border-bottom:1px solid #26323d;padding:calc(9px + env(safe-area-inset-top)) 12px 9px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brandline{display:flex;align-items:center;gap:9px}.logo{width:34px;height:34px;border-radius:10px;background:#e9eef1;color:#101820;display:grid;place-items:center;font-weight:900;font-size:14px}
.title{font-weight:850;font-size:16px;line-height:1.1}.clock{font-size:11px;color:#9fb0bd;text-align:right;line-height:1.5}.headerCash{font-size:13px;color:#f5f8fa;font-weight:750}
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(12,18,24,.97);border-top:1px solid #293640}
nav button{border:0;background:transparent;color:#8295a5;padding:8px 3px 7px;border-radius:10px;font-size:11px;white-space:nowrap}
nav button::before{content:"";display:block;width:18px;height:3px;border-radius:4px;margin:0 auto 5px;background:transparent}
nav button.active{color:#f3f6f8;background:#18232c}nav button.active::before{background:#e8b85e}
main{max-width:1180px;margin:0 auto;padding:10px 10px 8px}.page{display:none}.page.active{display:block}
#map.page.active{margin:-10px -10px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric,.card,.panel{background:#121b23;border:1px solid #293640;border-radius:13px;padding:11px}
.metric b{display:block;font-size:19px;letter-spacing:-.3px}.metric span,.muted{font-size:11px;color:#8fa2b1}.section{font-size:14px;margin:15px 2px 8px;color:#dfe7ed}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.name{font-weight:750}.tag{display:inline-block;background:#1d2a34;color:#becbd4;padding:3px 7px;border-radius:7px;font-size:10px;margin:4px 4px 0 0}
.list{display:flex;flex-direction:column;gap:7px}.detail{font-size:12px;line-height:1.65;color:#c7d2da;margin-top:7px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.btn{border:0;border-radius:9px;padding:8px 10px;background:#e9eef1;color:#111820;font-weight:750;font-size:12px}.btn.secondary{background:#202d37;color:#dce5eb;border:1px solid #34444f}.btn.danger{background:#44282a;color:#ffdadd}
.toolbar{display:flex;gap:6px;flex-wrap:wrap}.toolbar .btn{flex:1;min-width:82px}input,select{width:100%;border:1px solid #34444f;border-radius:9px;background:#0e171e;color:#eef3f6;padding:9px;font-size:12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:7px}.form .wide{grid-column:1/-1}
.notice{position:fixed;left:10px;right:10px;bottom:118px;z-index:60;padding:10px 11px;border-radius:10px;background:#eef2f4;color:#101820;font-size:12px;display:none;box-shadow:0 10px 35px #0009}.notice.error{background:#5b292d;color:#fff}
footer{position:fixed;left:8px;right:8px;bottom:59px;z-index:39;background:rgba(17,25,33,.94);border:1px solid #2b3944;border-radius:12px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;box-shadow:0 6px 20px #0006}
footer button{border:0;border-radius:8px;padding:8px 4px;background:#1d2a34;color:#d9e2e8;font-size:11px}
.mapShell{position:relative;background:#cad0c0;overflow:hidden;border-bottom:1px solid #34434b;height:calc(100dvh - 176px);min-height:460px}
.mapwrap{width:100%;height:100%;min-height:0;position:relative;overflow:hidden;touch-action:none;background:
linear-gradient(160deg,#e5e8db,#d9e0d4 52%,#dedccb)}
.mapwrap svg{width:100%;height:100%;display:block}
.mapHud{position:absolute;left:9px;top:9px;z-index:5;display:flex;gap:6px;align-items:center;max-width:calc(100% - 105px)}
.mapChip{background:rgba(15,23,29,.90);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:7px 9px;color:#eef3f5;box-shadow:0 4px 14px #0003}.mapChip b{font-size:12px;display:block}.mapChip span{font-size:9px;color:#99abb8}
.mapControls{position:absolute;right:8px;top:8px;z-index:6;display:flex;flex-direction:column;gap:5px}.mapControls button{width:38px;height:38px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(15,23,29,.92);color:#fff;font-size:17px}
.mapLegend{position:absolute;left:8px;bottom:8px;z-index:5;background:rgba(15,23,29,.86);border:1px solid rgba(255,255,255,.09);border-radius:9px;padding:6px 8px;display:flex;gap:9px;flex-wrap:wrap;font-size:9px;color:#cbd5db;max-width:calc(100% - 16px)}
.leg{display:flex;align-items:center;gap:4px}.leg i{display:block;width:20px;border-top-style:solid;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.14)}.leg.exp i{border-top-width:6px;border-color:#079e83}.leg.nat i{border-top-width:5px;border-color:#2aaa86}.leg.pro i{border-top-width:4px;border-color:#55b391}.leg.cty i{border-top-width:3px;border-color:#82ae99}
.road-shadow,.road-casing,.road{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.road-shadow{stroke:#65766c;opacity:.16}
.road{stroke:#f7f4ea}
.road-shadow.local{stroke-width:4}.road-casing.local{stroke:#aeb9b1;stroke-width:2.6}.road.local{stroke-width:1.35}
.road-shadow.county_road{stroke-width:5}.road-casing.county_road{stroke:#82ae99;stroke-width:3.4}.road.county_road{stroke-width:1.9}
.road-shadow.provincial_road{stroke-width:6.5}.road-casing.provincial_road{stroke:#55b391;stroke-width:4.7}.road.provincial_road{stroke-width:2.7}
.road-shadow.national_road{stroke-width:8.2}.road-casing.national_road{stroke:#2aaa86;stroke-width:6.1}.road.national_road{stroke-width:3.7}
.road-shadow.expressway{stroke-width:10.5;opacity:.18}.road-casing.expressway{stroke:#079e83;stroke-width:8.1}.road.expressway{stroke-width:5.0}
.road-shadow.role-urban_ring{stroke-width:7.1}.road-casing.role-urban_ring{stroke:#239f82;stroke-width:5.3}.road.role-urban_ring{stroke-width:3.1}
.road-shadow.role-connector{stroke-width:5.7}.road-casing.role-connector{stroke:#5aaf90;stroke-width:4.0}.road.role-connector{stroke-width:2.25}
.road-shadow.role-ramp{stroke-width:4.2;opacity:.13}.road-casing.role-ramp{stroke:#63ad94;stroke-width:3.0}.road.role-ramp{stroke-width:1.55}
.road-shadow.role-local_access{stroke-width:3.7;opacity:.12}.road-casing.role-local_access{stroke:#99ada2;stroke-width:2.45}.road.role-local_access{stroke-width:1.2}
.junctionCasing,.junctionPatch{vector-effect:non-scaling-stroke}.junctionCasing{stroke:none}.junctionPatch{fill:#f7f4ea;stroke:none}
.junctionCasing.expressway{fill:#079e83}.junctionCasing.national_road{fill:#2aaa86}.junctionCasing.provincial_road{fill:#55b391}.junctionCasing.county_road{fill:#82ae99}.junctionCasing.local{fill:#aeb9b1}
.junctionHalo{fill:none;stroke:#6f8e7e;stroke-width:.7;opacity:.22;vector-effect:non-scaling-stroke}
.roadShield{filter:drop-shadow(0 1px 1px rgba(24,42,34,.22))}
.roadShield rect{rx:3;ry:3;stroke:#fffdf6;stroke-width:.85;vector-effect:non-scaling-stroke}.roadShield text{font-size:7.3px;font-weight:850;text-anchor:middle;fill:#fff;pointer-events:none}.roadShield.expressway rect{fill:#078d76}.roadShield.national_road rect{fill:#db6250}.roadShield.provincial_road rect{fill:#3f9d7b}.roadShield.county_road rect{fill:#718b7e}.roadShield.local rect{fill:#858d87}
.stationHalo{fill:none;stroke:#d89c3d;stroke-width:2.2;opacity:.46;vector-effect:non-scaling-stroke}
.station{fill:#f7f4e8;stroke:#202b32;stroke-width:1.8;vector-effect:non-scaling-stroke}.station.hub{fill:#f0b75c;stroke-width:2.5}.station.city{fill:#fbf6e9;stroke-width:2.1}.station.county{fill:#eef0e9;stroke-width:1.6}.station.town{fill:#e7ebe4;stroke-width:1.3}
.station.locked{fill:#bcc3bd;stroke:#737e78;opacity:.88}.stationHalo.locked{stroke:#8e9892;opacity:.34}
.stationLabel{font-size:10px;fill:#1c272c;paint-order:stroke;stroke:#eef0e3;stroke-width:3px;stroke-linejoin:round;font-weight:650;pointer-events:none}.stationLabel.hub{font-size:15px;font-weight:900}.stationLabel.city{font-size:12.5px;font-weight:780}.stationLabel.county{font-size:10.5px}.stationLabel.town{font-size:9px}.stationLabel.locked{fill:#707a75;stroke:#e2e5dc}
.stationLock rect{fill:#69746e;stroke:#eef1e9;stroke-width:.7;vector-effect:non-scaling-stroke}.stationLock path{fill:none;stroke:#69746e;stroke-width:1.2;stroke-linecap:round;vector-effect:non-scaling-stroke}
.routeHalo{fill:none;stroke:#f3a13a;stroke-width:10;opacity:.22;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.routeLine{fill:none;stroke:#f0a13a;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.routeBadge rect{fill:#e8972f;stroke:#fff6e6;stroke-width:1;rx:5;ry:5}.routeBadge text{fill:#fff;font-size:9px;font-weight:900;text-anchor:middle}
.vehicle{fill:#f0b44e;stroke:#151d22;stroke-width:2.2;vector-effect:non-scaling-stroke}
.roadCode{font-size:8.5px;font-weight:900;text-anchor:middle;paint-order:stroke;stroke:#f4f1e5;stroke-width:3px;stroke-linejoin:round;pointer-events:none}.roadCode.expressway{fill:#087f6e}.roadCode.national_road{fill:#168a73}.roadCode.provincial_road{fill:#3d8c72}.roadCode.county_road{fill:#657b70}.roadCode.local{fill:#7b817a}
.terrainCoast{fill:#bdd3d6;opacity:.46}.terrainLake{fill:#b7d2d5;opacity:.44}.terrainRiver{fill:none;stroke:#9fc6cf;stroke-width:2.7;opacity:.48;vector-effect:non-scaling-stroke}.terrainRiver.minor{stroke-width:1.4;opacity:.31}.terrainMountain{fill:#839b7e;opacity:.105}.terrainHill{fill:#a1ad91;opacity:.09}
#mapSvg[data-detail="0"] .priority2,#mapSvg[data-detail="0"] .priority3,#mapSvg[data-detail="0"] .priority4{display:none}
#mapSvg[data-detail="1"] .priority3,#mapSvg[data-detail="1"] .priority4{display:none}
#mapSvg[data-detail="2"] .priority4{display:none}
#mapSvg[data-detail="0"] .junctionCasing.priority2,#mapSvg[data-detail="0"] .junctionCasing.priority3,#mapSvg[data-detail="0"] .junctionCasing.priority4,#mapSvg[data-detail="0"] .junctionPatch.priority2,#mapSvg[data-detail="0"] .junctionPatch.priority3,#mapSvg[data-detail="0"] .junctionPatch.priority4,#mapSvg[data-detail="0"] .junctionHalo.priority2,#mapSvg[data-detail="0"] .junctionHalo.priority3,#mapSvg[data-detail="0"] .junctionHalo.priority4{display:none}
#mapSvg[data-detail="1"] .junctionCasing.priority3,#mapSvg[data-detail="1"] .junctionCasing.priority4,#mapSvg[data-detail="1"] .junctionPatch.priority3,#mapSvg[data-detail="1"] .junctionPatch.priority4,#mapSvg[data-detail="1"] .junctionHalo.priority3,#mapSvg[data-detail="1"] .junctionHalo.priority4{display:none}
#mapSvg[data-detail="2"] .junctionCasing.priority4,#mapSvg[data-detail="2"] .junctionPatch.priority4,#mapSvg[data-detail="2"] .junctionHalo.priority4{display:none}
#mapSvg[data-detail="0"] .station.city,#mapSvg[data-detail="0"] .station.county,#mapSvg[data-detail="0"] .station.town,#mapSvg[data-detail="0"] .stationLabel.city,#mapSvg[data-detail="0"] .stationLabel.county,#mapSvg[data-detail="0"] .stationLabel.town{display:none}
#mapSvg[data-detail="1"] .station.county,#mapSvg[data-detail="1"] .station.town,#mapSvg[data-detail="1"] .stationLabel.county,#mapSvg[data-detail="1"] .stationLabel.town{display:none}
#mapSvg[data-detail="2"] .station.town,#mapSvg[data-detail="2"] .stationLabel.town{display:none}
.mapFoot{display:none}.mapRouteBtn{position:absolute;right:10px;bottom:52px;z-index:7;border:0;border-radius:12px;padding:10px 13px;background:#f4f6f4;color:#111820;font-weight:850;font-size:12px;box-shadow:0 5px 18px #0004}
.empty{padding:22px;text-align:center;color:#8295a5}.money.pos{color:#8cd9a4}.money.neg{color:#ff9999}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.form{grid-template-columns:repeat(4,1fr)}main{padding-left:14px;padding-right:14px}#map.page.active{margin-left:-14px;margin-right:-14px}}
</style>
</head>
<body>
<header><div class="top"><div class="brandline"><div class="logo">客</div><div><div class="title">星河客运</div><div class="muted" id="companyName">加载中</div></div></div><div><div class="headerCash" id="headerCash">¥0</div><div class="clock" id="clock"></div></div></div></header>
<nav id="nav">
<button class="active" data-page="map">地图</button>
<button data-page="routes">线路</button>
<button data-page="fleet">车队</button>
<button data-page="market">车市</button>
<button data-page="home">经营</button>
</nav>
<main>
<section class="page" id="home"><div class="grid" id="homeMetrics"></div><h2 class="section">快捷经营</h2><div class="toolbar"><button class="btn" onclick="advance(60)">推进1小时</button><button class="btn" onclick="advance(360)">推进6小时</button><button class="btn secondary" onclick="commitToday()">提交今日排班</button><button class="btn secondary" onclick="replanToday()">重排今日运营</button></div><h2 class="section">运营状态</h2><div id="homeStatus"></div><h2 class="section">管理中心</h2><div class="toolbar"><button class="btn secondary" onclick="openPage('dispatch')">调度中心</button><button class="btn secondary" onclick="openPage('finance')">财务报表</button></div></section>
<section class="page active" id="map">
<div class="mapShell">
  <div class="mapwrap" id="mapWrap">
    <svg id="mapSvg" viewBox="0 0 1000 650" data-detail="0"></svg>
    <div class="mapHud">
      <div class="mapChip"><b>全国运营路网</b><span id="mapStats">加载中</span></div>
    </div>
    <div class="mapControls">
      <button onclick="mapZoom(.72)">＋</button>
      <button onclick="mapZoom(1.38)">－</button>
      <button onclick="mapReset()">⌂</button>
    </div>
    <div class="mapLegend">
      <span class="leg exp"><i></i>高速</span>
      <span class="leg nat"><i></i>国道</span>
      <span class="leg pro"><i></i>省道</span>
      <span class="leg cty"><i></i>县乡道</span>
    </div>
  </div>
  <button class="mapRouteBtn" onclick="openPage('routes')">新建线路</button>
</div>
</section>
<section class="page" id="routes"><div class="panel"><div class="name">新建线路</div><div class="form" style="margin-top:9px"><input id="routeCode" value="K01" placeholder="线路编号"><select id="origin"></select><select id="destination"></select><button class="btn" onclick="createRoute()">创建并开通</button></div></div><h2 class="section">已有线路</h2><div class="list" id="routeList"></div></section>
<section class="page" id="market"><div class="toolbar"><button class="btn secondary" onclick="setMarketFilter('all')">全部</button><button class="btn secondary" onclick="setMarketFilter('new')">新车</button><button class="btn secondary" onclick="setMarketFilter('used')">二手</button></div><h2 class="section">动态车源</h2><div class="list" id="marketList"></div></section>
<section class="page" id="dispatch"><div class="grid" id="dispatchMetrics"></div><h2 class="section">班次</h2><div class="list" id="tripList"></div><h2 class="section">缺口</h2><div class="list" id="shortageList"></div></section>
<section class="page" id="fleet"><div class="list" id="fleetList"></div></section>
<section class="page" id="finance"><div class="grid" id="financeMetrics"></div><h2 class="section">经营说明</h2><div class="card detail">票款、购车、能源、通行费、站务费、司机工资、维护、保险、车辆税和折旧均来自正式 Finance Ledger。时间推进后会自动结算。</div></section>
</main>
<div class="notice" id="notice"></div>
<footer><button onclick="advance(15)">+15分</button><button onclick="advance(60)">+1小时</button><button onclick="advance(360)">+6小时</button><button onclick="refresh()">刷新</button></footer>
<script src="game.js"></script>
<script>
let state=null,marketFilter="all",mapCamera=null,mapDrag=null;
const q=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=c=>"¥"+(Number(c||0)/100).toLocaleString("zh-CN",{maximumFractionDigits:0});
const time=s=>{s=Number(s||0);const d=Math.floor(s/86400)+1,h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60);return "第"+d+"天 "+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")};
function openPage(id){document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===id));document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));q(id).classList.add("active")}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>openPage(b.dataset.page));
async function call(fn,...args){try{const r=await CoachGame[fn](...args);toast(r.message,!r.ok);await refresh()}catch(e){toast(String(e),true)}}
function toast(msg,error=false){const n=q("notice");n.textContent=msg;n.className="notice"+(error?" error":"");n.style.display="block";clearTimeout(window.__toast);window.__toast=setTimeout(()=>n.style.display="none",2600)}
async function refresh(){state=await CoachGame.snapshot();render()}
function render(){q("companyName").textContent="声誉 "+state.company.reputationPermille+"/1000";q("headerCash").textContent=money(state.finance?.cashBalanceCents||0);q("clock").innerHTML=time(state.currentGameSecond)+" · V"+state.version;renderHome();renderMap();renderRoutes();renderMarket();renderDispatch();renderFleet();renderFinance();fillStations()}
function renderHome(){const f=state.finance||{},d=state.dispatch?.summary||{};q("homeMetrics").innerHTML=metric("现金",money(f.cashBalanceCents))+metric("今日班次",d.passengerTripsTotal||0)+metric("运营车辆",d.fleetRunning||0)+metric("候补缺口",d.shortageTrips||0)+metric("客运收入",money(f.passengerRevenueCents))+metric("总费用",money(f.totalExpenseCents))+metric("利润",money(f.accountingProfitCents))+metric("车队",d.fleetTotal||0);q("homeStatus").innerHTML='<div class="card detail">完成闭环：买车 → 补能 → 开线路 → 建班次 → 提交排班 → 推进时间。调度中心会自动上客、发车、运行、结算和处理支持任务。</div>'}
function metric(k,v){return '<div class="metric"><b>'+esc(v)+'</b><span>'+esc(k)+'</span></div>'}
function fillStations(){const available=state.stations.filter(s=>s.unlocked);const html=available.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>').join("");const currentOrigin=q("origin").value,currentDestination=q("destination").value;q("origin").innerHTML=html;q("destination").innerHTML=html;if(currentOrigin&&available.some(s=>s.id===currentOrigin))q("origin").value=currentOrigin;if(currentDestination&&available.some(s=>s.id===currentDestination))q("destination").value=currentDestination;else if(q("destination").options.length>1)q("destination").selectedIndex=1}
function mapBase(){const b=state.mapBounds||{minXM:0,minYM:0,maxXM:900000,maxYM:600000},ww=Math.max(1,b.maxXM-b.minXM),wh=Math.max(1,b.maxYM-b.minYM),cw=1100,ch=825;return{b,ww,wh,cw,ch}}
function terrainLayer(m){const w=m.cw,h=m.ch;return '<path class="terrainMountain" d="M20 '+(h*.12)+' C '+(w*.12)+' '+(h*.02)+' '+(w*.24)+' '+(h*.08)+' '+(w*.31)+' '+(h*.22)+' C '+(w*.24)+' '+(h*.31)+' '+(w*.14)+' '+(h*.38)+' 20 '+(h*.34)+' Z"/><path class="terrainHill" d="M'+(w*.22)+' '+(h*.54)+' C '+(w*.33)+' '+(h*.44)+' '+(w*.43)+' '+(h*.47)+' '+(w*.50)+' '+(h*.60)+' C '+(w*.42)+' '+(h*.72)+' '+(w*.30)+' '+(h*.73)+' '+(w*.22)+' '+(h*.54)+' Z"/><path class="terrainMountain" d="M'+(w*.52)+' '+(h*.08)+' C '+(w*.63)+' '+(h*.02)+' '+(w*.74)+' '+(h*.08)+' '+(w*.79)+' '+(h*.20)+' C '+(w*.72)+' '+(h*.27)+' '+(w*.61)+' '+(h*.29)+' '+(w*.52)+' '+(h*.08)+' Z"/><path class="terrainCoast" d="M'+(w*.94)+' 0 C '+(w*.91)+' '+(h*.15)+' '+(w*.97)+' '+(h*.26)+' '+(w*.93)+' '+(h*.39)+' C '+(w*.89)+' '+(h*.53)+' '+(w*.96)+' '+(h*.67)+' '+(w*.91)+' '+(h*.80)+' C '+(w*.96)+' '+(h*.89)+' '+(w*.97)+' '+h+' '+w+' '+h+' L '+w+' 0 Z"/><path class="terrainRiver" d="M'+(w*.08)+' '+(h*.43)+' C '+(w*.22)+' '+(h*.39)+' '+(w*.32)+' '+(h*.48)+' '+(w*.45)+' '+(h*.45)+' S '+(w*.70)+' '+(h*.40)+' '+(w*.91)+' '+(h*.48)+'"/><path class="terrainRiver minor" d="M'+(w*.35)+' '+(h*.16)+' C '+(w*.40)+' '+(h*.28)+' '+(w*.48)+' '+(h*.31)+' '+(w*.55)+' '+(h*.46)+' S '+(w*.64)+' '+(h*.67)+' '+(w*.72)+' '+(h*.78)+'"/><ellipse class="terrainLake" cx="'+(w*.73)+'" cy="'+(h*.60)+'" rx="'+(w*.025)+'" ry="'+(h*.018)+'"/>'}
function smoothPath(points,sx,sy){if(!points||points.length<2)return"";const p=points.map(v=>({x:sx(v.xM),y:sy(v.yM)}));let d='M '+p[0].x.toFixed(1)+' '+p[0].y.toFixed(1);for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2,cp1x=p1.x+(p2.x-p0.x)/6,cp1y=p1.y+(p2.y-p0.y)/6,cp2x=p2.x-(p3.x-p1.x)/6,cp2y=p2.y-(p3.y-p1.y)/6;d+=' C '+cp1x.toFixed(1)+' '+cp1y.toFixed(1)+' '+cp2x.toFixed(1)+' '+cp2y.toFixed(1)+' '+p2.x.toFixed(1)+' '+p2.y.toFixed(1)}return d}
function stitchCorridors(roads){const groups=new Map();roads.forEach(r=>{const key=[r.roadCode||r.id,r.roadClass,r.displayPriority||4,r.roadRole||"mainline"].join("|");if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r)});const corridors=[];groups.forEach(group=>{const byNode=new Map();group.forEach(seg=>{[seg.fromNodeId,seg.toNodeId].forEach(id=>{if(!byNode.has(id))byNode.set(id,[]);byNode.get(id).push(seg)})});const left=new Set(group.map(s=>s.id));while(left.size){let start=[...byNode.entries()].find(([id,segs])=>segs.filter(s=>left.has(s.id)).length===1)?.[0];if(!start)start=group.find(s=>left.has(s.id)).fromNodeId;let current=start,points=[],meta=null,showLabel=false;while(true){const options=(byNode.get(current)||[]).filter(s=>left.has(s.id));if(!options.length)break;const seg=options[0];left.delete(seg.id);meta=meta||seg;showLabel=showLabel||!!seg.showLabel;const forward=seg.fromNodeId===current,part=forward?seg.points:[...seg.points].reverse();if(points.length)part.shift();points.push(...part);current=forward?seg.toNodeId:seg.fromNodeId;if((byNode.get(current)||[]).filter(s=>left.has(s.id)).length>1)break}if(meta&&points.length>1)corridors.push({...meta,showLabel,points})}});return corridors}
function shieldSvg(r,sx,sy){if(!r.showLabel||!r.roadCode||!r.points?.length)return"";const p=r.points[Math.floor(r.points.length/2)],x=sx(p.xM),y=sy(p.yM),w=Math.max(18,7+r.roadCode.length*4.8);return '<g class="roadShield '+esc(r.roadClass)+' priority'+(r.displayPriority||4)+'" transform="translate('+(x-w/2).toFixed(1)+' '+(y-7).toFixed(1)+')"><rect width="'+w.toFixed(1)+'" height="13"></rect><text x="'+(w/2).toFixed(1)+'" y="9.2">'+esc(r.roadCode)+'</text></g>'}
function initialMapCamera(m){const hubs=state.stations.filter(s=>s.stationClass==="hub").slice(0,3);if(!hubs.length)return{x:0,y:0,w:m.cw,h:m.ch};const wx=hubs.reduce((v,s)=>v+s.xM,0)/hubs.length,wy=hubs.reduce((v,s)=>v+s.yM,0)/hubs.length,cx=(wx-m.b.minXM)/m.ww*m.cw,cy=m.ch-(wy-m.b.minYM)/m.wh*m.ch,w=m.cw*.34,h=w*(m.ch/m.cw);return{x:Math.max(0,Math.min(m.cw-w,cx-w*.50)),y:Math.max(0,Math.min(m.ch-h,cy-h*.52)),w,h}}
function routeBadgeSvg(route,sx,sy){if(!route.pathPoints||route.pathPoints.length<2)return"";const p=route.pathPoints[Math.floor(route.pathPoints.length/2)],x=sx(p.xM),y=sy(p.yM),w=Math.max(24,10+String(route.code||"").length*6);return '<g class="routeBadge" transform="translate('+(x-w/2).toFixed(1)+' '+(y-9).toFixed(1)+')"><rect width="'+w+'" height="17"></rect><text x="'+(w/2).toFixed(1)+'" y="11.5">'+esc(route.code)+'</text></g>'}
function renderMap(){const m=mapBase(),sx=x=>(x-m.b.minXM)/m.ww*m.cw,sy=y=>m.ch-(y-m.b.minYM)/m.wh*m.ch;if(!mapCamera)mapCamera=initialMapCamera(m);let h=terrainLayer(m),shadows='',edges='',junctionCasings='',surfaces='',junctionSurfaces='',routeHalos='',routeLines='',labels='',routeLabels='',counts={expressway:0,national_road:0,provincial_road:0,county_road:0,local:0};state.roads.forEach(r=>counts[r.roadClass]=(counts[r.roadClass]||0)+1);const corridors=stitchCorridors(state.roads).sort((a,b)=>(b.displayPriority||4)-(a.displayPriority||4));corridors.forEach(r=>{const priority='priority'+(r.displayPriority||4),role='role-'+esc(r.roadRole||"mainline"),d=smoothPath(r.points,sx,sy),cls=esc(r.roadClass);shadows+='<path class="road-shadow '+cls+' '+role+' '+priority+'" d="'+d+'"/>';edges+='<path class="road-casing '+cls+' '+role+' '+priority+'" d="'+d+'"/>';surfaces+='<path class="road '+cls+' '+role+' '+priority+'" d="'+d+'"/>';labels+=shieldSvg(r,sx,sy)});
(state.junctions||[]).forEach(j=>{const x=sx(j.xM),y=sy(j.yM),p=j.displayPriority||4,priority='priority'+p,cls=esc(j.roadClass||"local"),sizes=j.roadClass==="expressway"?[4.35,2.6]:j.roadClass==="national_road"?[3.35,2.05]:j.roadClass==="provincial_road"?[2.65,1.55]:j.roadClass==="county_road"?[2.05,1.1]:[1.6,.8];junctionCasings+='<circle class="junctionCasing '+cls+' '+priority+'" cx="'+x+'" cy="'+y+'" r="'+sizes[0]+'"/>';junctionSurfaces+='<circle class="junctionPatch '+priority+'" cx="'+x+'" cy="'+y+'" r="'+sizes[1]+'"/>';if(j.degree>=3&&p<=2)junctionSurfaces+='<circle class="junctionHalo '+priority+'" cx="'+x+'" cy="'+y+'" r="'+(sizes[0]+1.2)+'"/>'});
(state.routes||[]).filter(r=>r.status==="active"&&r.pathPoints?.length>1).forEach(route=>{const d=smoothPath(route.pathPoints,sx,sy);routeHalos+='<path class="routeHalo" d="'+d+'"/>';routeLines+='<path class="routeLine" d="'+d+'"/>';routeLabels+=routeBadgeSvg(route,sx,sy)});
h+=shadows+edges+junctionCasings+surfaces+junctionSurfaces+routeHalos+routeLines+labels+routeLabels;
state.stations.forEach(s=>{const x=sx(s.xM),y=sy(s.yM),cls=s.stationClass||"county",locked=!s.unlocked,rad=cls==="hub"?10.2:cls==="city"?7.4:cls==="county"?5.0:3.4;if(cls==="hub")h+='<circle class="stationHalo '+(locked?'locked':'')+'" cx="'+x+'" cy="'+y+'" r="'+(rad+4.2)+'"/>';h+='<circle class="station '+esc(cls)+' '+(locked?'locked':'')+'" cx="'+x+'" cy="'+y+'" r="'+rad+'"/>';if(locked)h+='<g class="stationLock" transform="translate('+x+' '+y+')"><path d="M-2.6 -1.4 V-3.0 A2.6 2.6 0 0 1 2.6 -3.0 V-1.4"/><rect x="-3.4" y="-1.5" width="6.8" height="5.5" rx="1.2"/></g>';h+='<text class="stationLabel '+esc(cls)+' '+(locked?'locked':'')+'" x="'+(x+rad+4)+'" y="'+(y-rad*.55)+'">'+esc(s.name.replace("客运中心",""))+'</text>'});
(state.visibleVehicles||[]).forEach(v=>h+='<circle class="vehicle" cx="'+sx(v.xM)+'" cy="'+sy(v.yM)+'" r="6.2"/>');q("mapSvg").innerHTML=h;const unlocked=state.stations.filter(s=>s.unlocked).length;q("mapStats").textContent='已解锁 '+unlocked+'/'+state.stations.length+' · 声誉 '+state.company.reputationPermille+'/1000';applyMapCamera()}
function applyMapCamera(){if(!mapCamera)return;const m=mapBase(),ratio=mapCamera.w/m.cw,detail=ratio<.22?3:ratio<.42?2:ratio<.70?1:0;q("mapSvg").setAttribute("viewBox",[mapCamera.x,mapCamera.y,mapCamera.w,mapCamera.h].join(" "));q("mapSvg").setAttribute("data-detail",String(detail))}
function mapZoom(f){const m=mapBase(),cx=mapCamera.x+mapCamera.w/2,cy=mapCamera.y+mapCamera.h/2;mapCamera.w=Math.max(m.cw*.14,Math.min(m.cw,mapCamera.w*f));mapCamera.h=mapCamera.w*(m.ch/m.cw);mapCamera.x=Math.max(0,Math.min(m.cw-mapCamera.w,cx-mapCamera.w/2));mapCamera.y=Math.max(0,Math.min(m.ch-mapCamera.h,cy-mapCamera.h/2));applyMapCamera()}
function mapReset(){const m=mapBase();mapCamera={x:0,y:0,w:m.cw,h:m.ch};applyMapCamera()}
q("mapWrap").addEventListener("pointerdown",e=>{if(!mapCamera)return;mapDrag={x:e.clientX,y:e.clientY,cx:mapCamera.x,cy:mapCamera.y};q("mapWrap").setPointerCapture(e.pointerId)});
q("mapWrap").addEventListener("pointermove",e=>{if(!mapDrag||!mapCamera)return;const rect=q("mapWrap").getBoundingClientRect(),dx=(e.clientX-mapDrag.x)*mapCamera.w/rect.width,dy=(e.clientY-mapDrag.y)*mapCamera.h/rect.height,m=mapBase();mapCamera.x=Math.max(0,Math.min(m.cw-mapCamera.w,mapDrag.cx-dx));mapCamera.y=Math.max(0,Math.min(m.ch-mapCamera.h,mapDrag.cy-dy));applyMapCamera()});

function renderRoutes(){q("routeList").innerHTML=state.routes.length?state.routes.map(r=>{const plans=state.servicePlans.filter(p=>p.routeId===r.id);return '<div class="card"><div class="row"><div><div class="name">'+esc(r.code)+'</div><div class="muted">'+r.stations.map(x=>esc(x.name.replace("客运中心",""))).join(" → ")+'</div></div><span class="tag">'+esc(r.status)+'</span></div><div class="actions">'+(plans.length?'<span class="tag">已有 '+plans.length+' 个班次计划</span>':'<button class="btn" onclick="openPlan(\''+esc(r.id)+'\')">建立班次</button>')+'</div></div>'}).join(""):'<div class="empty">还没有线路</div>'}

function renderMarket(){let rows=Array.isArray(state.market)?state.market:[];if(marketFilter!=="all")rows=rows.filter(x=>x.listingKind===marketFilter);rows=rows.slice(0,60);q("marketList").innerHTML=rows.length?rows.map(x=>'<div class="card"><div class="row"><div><div class="name">'+esc(x.brandName+" "+x.modelName)+'</div><div class="muted">'+esc(x.dealerName)+' · '+x.modelYear+' · '+(x.listingKind==="new"?"新车":"二手")+'</div></div><div class="name">'+money(x.askingPriceCents)+'</div></div><div><span class="tag">'+x.seatCapacity+'座</span><span class="tag">舒适 '+x.comfortPermille+'</span><span class="tag">Tier '+x.unlockTier+'</span><span class="tag">库存 '+x.stockCount+'</span></div><div class="actions">'+(x.purchaseUnlocked?'<button class="btn" onclick="buy(\''+esc(x.listingId)+'\')">购买</button>':'<span class="tag">未解锁：'+esc(x.unlockMissing.join("/"))+'</span>')+(x.listingKind==="used"?'<button class="btn secondary" onclick="inspect(\''+esc(x.listingId)+'\')">全检</button><button class="btn secondary" onclick="negotiate(\''+esc(x.listingId)+'\','+x.askingPriceCents+')">议价</button>':'')+'</div></div>').join(""):'<div class="empty">当前没有可用车源</div>'}
