name: Core Check

on:
  push:
    branches: [main]
    paths-ignore:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
      - "scripts/build-apk-web.mts"
  pull_request:
    paths-ignore:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
      - "scripts/build-apk-web.mts"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
