name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android-app/**"
      - "scripts/build-apk-web.mts"
      - "src/content/vehicle/**"
      - "src/core/version/**"
      - "package.json"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "scripts/build-apk-web.mts"
      - "src/content/vehicle/**"
      - "src/core/version/**"
      - "package.json"
      - ".github/workflows/android-apk.yml"

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web build dependencies
        run: npm install

      - name: Generate APK presentation assets
        run: npm run build:apk-web

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android-app assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          cp android-app/app/build/outputs/apk/debug/app-debug.apk artifacts/coach-company-sim-v0.16.0-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: coach-company-sim-v0.16.0-debug
          path: artifacts/coach-company-sim-v0.16.0-debug.apk
          if-no-files-found: error
          retention-days: 14
